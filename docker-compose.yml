services:
    gluetun:
        image: qmcgaw/gluetun:latest
        container_name: protonvpn
        restart: always
        cap_add:
            - NET_ADMIN
        devices:
            - /dev/net/tun:/dev/net/tun
        sysctls:
            net.ipv4.ip_forward: "1"
            net.ipv6.conf.all.disable_ipv6: "0"
            net.ipv6.conf.all.forwarding: "1"
            net.ipv6.conf.all.accept_ra: "2"
        environment:
            VPN_SERVICE_PROVIDER: protonvpn
            VPN_TYPE: ${VPN_TYPE:-wireguard}
            WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
            WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:-}
            OPENVPN_USER: ${OPENVPN_USER:-}
            OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:-}
            OPENVPN_PROTOCOL: ${OPENVPN_PROTOCOL:-udp}
            SERVER_COUNTRIES: ${SERVER_COUNTRIES:-Japan}
            SERVER_REGIONS: ${SERVER_REGIONS:-}
            SERVER_CITIES: ${SERVER_CITIES:-}
            FREE_ONLY: ${FREE_ONLY:-on}
            STREAM_ONLY: ${STREAM_ONLY:-off}
            SECURE_CORE_ONLY: ${SECURE_CORE_ONLY:-off}
            TOR_ONLY: ${TOR_ONLY:-off}
            PORT_FORWARD_ONLY: ${PORT_FORWARD_ONLY:-off}
            VPN_PORT_FORWARDING: ${VPN_PORT_FORWARDING:-off}
            UPDATER_PERIOD: ${UPDATER_PERIOD:-480h}
        volumes:
            - ./data_gluetun:/gluetun
            - ./gluetun-post-rules.txt:/iptables/post-rules.txt:ro
        networks:
            - private_net

    tailscale:
        image: tailscale/tailscale:latest
        container_name: tailscale-protonvpn
        restart: always
        depends_on:
            gluetun:
                condition: service_healthy
        dns:
            - 1.1.1.1
            - 1.0.0.1
        environment:
            TS_AUTHKEY: ${TS_AUTHKEY:-}
            TS_STATE_DIR: /var/lib/tailscale
            TS_USERSPACE: "false"
            TS_EXTRA_ARGS: "--advertise-exit-node --accept-dns=false"
            # 経路分離の上書き設定。通常は空・既定のままでよい
            # PROTON_GW: GluetunのIPv4。空ならサービス名 gluetun から名前解決する
            PROTON_GW: ${PROTON_GW:-}
            PROTON_GW6: ${PROTON_GW6:-}
            # TS_FWMARK: tailscaledの bypass fwmark。空なら自動検出される
            TS_FWMARK: ${TS_FWMARK:-}
            UNDERLAY_TABLE: ${UNDERLAY_TABLE:-100}
            UNDERLAY_PRIO: ${UNDERLAY_PRIO:-5200}
        volumes:
            - ./data_tailscale:/var/lib/tailscale
            - /dev/net/tun:/dev/net/tun
            - /etc/hostname:/host_hostname:ro
            - ./entrypoint.sh:/entrypoint.sh:ro
            - ./verify-routing.sh:/verify-routing.sh:ro
        cap_add:
            - NET_ADMIN
            - NET_RAW
        sysctls:
            net.ipv6.conf.all.disable_ipv6: "0"
            # fwmark付きパケットの逆経路チェック (rp_filter) に必要
            net.ipv4.conf.all.src_valid_mark: "1"
            net.ipv4.ip_forward: "1"
            net.ipv6.conf.all.forwarding: "1"
        networks:
            - private_net
        entrypoint:
            - /bin/sh
            - /entrypoint.sh

networks:
    private_net:
        enable_ipv6: true
