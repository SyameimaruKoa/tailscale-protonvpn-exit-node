name: Validate Compose and shell

on:
    push:
    pull_request:

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Check shell syntax
              run: |
                  sh -n entrypoint.sh
                  sh -n scripts/route-guard.sh

            - name: Validate shell with ShellCheck
              run: shellcheck -s sh entrypoint.sh scripts/route-guard.sh

            - name: Validate Compose configuration
              run: |
                  cp .env.example .env
                  docker compose config --quiet
